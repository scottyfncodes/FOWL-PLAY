<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9c8"/>
      <stop offset="1" stop-color="#e5c98f"/>
    </linearGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8f5a"/>
      <stop offset="1" stop-color="#4f6b3a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- DNA helix, subtle, behind the chicken -->
  <g stroke="url(#helix)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M392 70 C332 130 332 190 392 250 C452 310 452 370 392 430"/>
    <path d="M452 70 C512 130 512 190 452 250 C392 310 392 370 452 430"/>
    <path d="M404 106 h36 M398 160 h48 M404 214 h36 M404 286 h36 M398 340 h48 M404 394 h36"/>
  </g>
  <!-- ground shadow -->
  <ellipse cx="236" cy="432" rx="150" ry="18" fill="#2b2118" opacity="0.14"/>
  <!-- tail -->
  <path d="M330 262 q70 -70 60 -130 q-20 60 -80 100 z" fill="#c8553d" stroke="#5e2012" stroke-width="8" stroke-linejoin="round"/>
  <path d="M334 278 q90 -40 100 -110 q-40 50 -104 78 z" fill="#d9a441" stroke="#8f5b16" stroke-width="8" stroke-linejoin="round"/>
  <!-- legs -->
  <path d="M212 392 v40 M268 392 v40 M180 434 h64 M236 434 h64" stroke="#e2b33a" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M212 392 v40 M268 392 v40 M180 434 h64 M236 434 h64" stroke="#8f5b16" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- body -->
  <ellipse cx="240" cy="300" rx="130" ry="102" fill="#f8f4ea" stroke="#2b2118" stroke-width="10"/>
  <path d="M170 290 q70 -30 120 20 q-30 60 -110 40 z" fill="#efe6d2" stroke="#2b2118" stroke-width="8" stroke-linejoin="round"/>
  <!-- neck + head -->
  <path d="M118 262 Q96 190 132 128 L184 138 Q176 200 168 264 z" fill="#f8f4ea" stroke="#2b2118" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="152" cy="132" r="58" fill="#f8f4ea" stroke="#2b2118" stroke-width="10"/>
  <!-- comb -->
  <path d="M112 92 l10 -34 l14 26 l14 -40 l14 30 l12 -30 l10 24 l8 -14 l4 40 z" fill="#c8553d" stroke="#5e2012" stroke-width="8" stroke-linejoin="round"/>
  <!-- wattle -->
  <ellipse cx="128" cy="190" rx="14" ry="22" fill="#c8553d" stroke="#5e2012" stroke-width="6"/>
  <!-- beak -->
  <path d="M100 120 l-48 18 l48 20 z" fill="#e0b04c" stroke="#8f6a1c" stroke-width="8" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="132" cy="122" r="12" fill="#1c1a1e"/>
  <circle cx="128" cy="118" r="4" fill="#fff"/>
  <!-- little flask / lab hint: egg with question mark -->
  <path d="M318 396 C336 396 350 376 350 354 C350 330 336 306 318 306 C300 306 286 330 286 354 C286 376 300 396 318 396 z" fill="#a9d3d6" stroke="#2b2118" stroke-width="8"/>
  <text x="318" y="372" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="46" fill="#2b2118">?</text>
</svg>
