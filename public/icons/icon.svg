<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7ecd2"/>
      <stop offset="1" stop-color="#e9c98f"/>
    </linearGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6fb6"/>
      <stop offset="1" stop-color="#8a4db8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- helix behind the chicken: the breeding cue -->
  <g fill="none" stroke="url(#helix)" stroke-width="20" stroke-linecap="round" opacity="0.8">
    <path d="M96 96 C 160 150, 160 210, 96 264 C 32 318, 32 378, 96 432"/>
    <path d="M176 96 C 112 150, 112 210, 176 264 C 240 318, 240 378, 176 432"/>
  </g>
  <g stroke="url(#helix)" stroke-width="16" stroke-linecap="round" opacity="0.8">
    <path d="M112 128 L160 128"/><path d="M112 232 L160 232"/><path d="M112 296 L160 296"/><path d="M112 400 L160 400"/>
  </g>
  <!-- tail -->
  <g fill="#c8553d" stroke="#2b2118" stroke-width="10" stroke-linejoin="round">
    <path d="M150 300 C 120 230, 130 170, 190 150 C 175 205, 190 240, 235 260 Z"/>
    <path d="M165 320 C 130 270, 128 210, 172 190 C 168 240, 190 270, 235 285 Z" fill="#d9a441"/>
  </g>
  <!-- body -->
  <ellipse cx="292" cy="318" rx="146" ry="112" fill="#fbf6ea" stroke="#2b2118" stroke-width="12"/>
  <!-- wing -->
  <path d="M250 300 C 300 260, 380 280, 400 330 C 360 350, 300 360, 250 300 Z" fill="#efe4cc" stroke="#2b2118" stroke-width="9" stroke-linejoin="round"/>
  <!-- neck & head -->
  <path d="M340 240 C 330 190, 350 140, 400 130 L 440 150 C 460 210, 440 250, 392 262 Z" fill="#fbf6ea" stroke="#2b2118" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="416" cy="176" r="58" fill="#fbf6ea" stroke="#2b2118" stroke-width="12"/>
  <!-- comb -->
  <path d="M378 132 l12 -38 l16 28 l14 -40 l14 34 l16 -30 l8 42 z" fill="#d8402f" stroke="#2b2118" stroke-width="9" stroke-linejoin="round"/>
  <!-- wattle -->
  <path d="M432 224 c 18 6, 22 30, 6 40 c -16 8, -30 -12, -22 -30 z" fill="#d8402f" stroke="#2b2118" stroke-width="8"/>
  <!-- beak -->
  <path d="M464 168 l52 14 l-52 20 z" fill="#e0b04c" stroke="#2b2118" stroke-width="9" stroke-linejoin="round"/>
  <!-- eye: big, expressive, slightly suspicious -->
  <circle cx="428" cy="168" r="17" fill="#2b2118"/>
  <circle cx="434" cy="161" r="6" fill="#ffffff"/>
  <path d="M404 142 q 26 -12 50 -2" fill="none" stroke="#2b2118" stroke-width="8" stroke-linecap="round"/>
  <!-- legs -->
  <g stroke="#e0b04c" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M262 424 L262 470"/><path d="M322 424 L322 470"/>
    <path d="M232 470 L262 470 L292 470"/><path d="M292 470 L322 470 L352 470"/>
  </g>
  <g stroke="#2b2118" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M262 424 L262 470"/><path d="M322 424 L322 470"/>
  </g>
</svg>
